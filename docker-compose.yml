services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: haliyal-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-land_records}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-land_records}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: haliyal-land-api
    environment:
      DATABASE_URL: postgresql://postgres:password@postgis:5432/land_records
      FRONTEND_DIR: /app/frontend
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  postgres_data:
